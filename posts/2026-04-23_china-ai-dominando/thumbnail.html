<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>China AI — Split Geopolitical</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: 1080px 1350px; margin: 0; }
html, body { margin: 0; padding: 0; background: #0A0A0A; width: 1080px; height: 1350px; }
.image {
  width: 1080px;
  height: 1350px;
  font-family: 'Inter', -apple-system, sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.top-area {
  flex: 1;
  position: relative;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.side {
  position: relative;
  padding: 60px 50px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: #FFFFFF;
  overflow: hidden;
}
.left {
  background: #0A1F3C;
  background-image:
    radial-gradient(circle at 30% 30%, rgba(100, 150, 220, 0.18) 0%, transparent 55%),
    radial-gradient(circle at 80% 80%, rgba(60, 90, 150, 0.12) 0%, transparent 50%);
}
.right {
  background: #C41E3A;
  background-image:
    radial-gradient(circle at 70% 30%, rgba(255, 200, 100, 0.18) 0%, transparent 55%),
    radial-gradient(circle at 20% 80%, rgba(255, 220, 80, 0.08) 0%, transparent 50%);
}
.country {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 5px;
  text-transform: uppercase;
  margin-bottom: 100px;
  opacity: 0.9;
}
.big-num {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 900;
  font-size: 150px;
  line-height: 0.9;
  letter-spacing: -6px;
  text-align: center;
}
.caption {
  margin-top: 22px;
  font-size: 26px;
  font-weight: 500;
  text-align: center;
  opacity: 0.88;
  line-height: 1.3;
  max-width: 90%;
}
.divider {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  background: #FFFFFF;
  z-index: 3;
}
.badge-vs {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: #F4D35E;
  color: #0A0A0A;
  padding: 14px 24px;
  font-weight: 900;
  font-size: 22px;
  letter-spacing: 4px;
  text-transform: uppercase;
  z-index: 4;
  border: 3px solid #0A0A0A;
}
.bottom-strip {
  height: 160px;
  flex-shrink: 0;
  background: #0A0A0A;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 0 40px;
}
.bottom-question {
  color: #FFFFFF;
  font-size: 38px;
  font-weight: 800;
  text-align: center;
  line-height: 1.1;
}
.bottom-question em {
  color: #F4D35E;
  font-style: normal;
}
.bottom-line {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-top: 16px;
  color: rgba(255, 255, 255, 0.6);
  font-size: 18px;
  letter-spacing: 2px;
}
.bottom-line .source {
  font-style: italic;
  font-size: 15px;
  color: rgba(255, 255, 255, 0.45);
}
</style>
</head>
<body>
<div class="image">
  <div class="top-area">
    <div class="side left">
      <div class="country">Estados Unidos</div>
      <div class="big-num">US$ 100M</div>
      <div class="caption">custo estimado do GPT-4</div>
    </div>
    <div class="side right">
      <div class="country">China</div>
      <div class="big-num">US$ 6M</div>
      <div class="caption">custo da DeepSeek-R1</div>
    </div>
    <div class="divider"></div>
    <div class="badge-vs">GEOPOLÍTICA DA IA</div>
  </div>
  <div class="bottom-strip">
    <div class="bottom-question">Quem está ganhando a <em>corrida da IA</em>?</div>
    <div class="bottom-line">
      <span>Apolo Santos</span>
      <span class="source">Fontes: MIT Tech Review, 2025 · The Information, 2024</span>
    </div>
  </div>
</div>
</body>
</html>
