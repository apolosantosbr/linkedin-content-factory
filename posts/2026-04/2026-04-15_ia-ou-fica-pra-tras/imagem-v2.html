<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
.image {
  width: 1080px;
  height: 1350px;
  position: relative;
  font-family: 'Inter', -apple-system, sans-serif;
  overflow: hidden;
}
.photo {
  position: absolute;
  inset: 0;
  background-image: url('https://images.unsplash.com/photo-1521737604893-d14cc237f11d?w=1080&h=1350&fit=crop');
  background-size: cover;
  background-position: center;
  filter: grayscale(100%) contrast(1.3) brightness(0.5);
}
.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,212,255,0.55), rgba(124,58,237,0.65));
  mix-blend-mode: color;
}
.dark-fade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10,10,10,0.3) 0%, rgba(10,10,10,0.5) 40%, rgba(10,10,10,0.95) 100%);
}
.content {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 80px;
  color: white;
}
.badge {
  display: inline-block;
  padding: 12px 28px;
  background: rgba(255,255,255,0.12);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(0, 212, 255, 0.5);
  border-radius: 50px;
  font-size: 16px;
  color: #00D4FF;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 32px;
  align-self: flex-start;
}
.highlight-num {
  display: inline-block;
  font-size: 24px;
  font-weight: 900;
  color: #00D4FF;
  letter-spacing: 3px;
  margin-bottom: 16px;
  text-transform: uppercase;
}
h1 {
  font-size: 76px;
  font-weight: 900;
  line-height: 0.98;
  letter-spacing: -2px;
  max-width: 920px;
  margin-bottom: 28px;
}
h1 .accent {
  background: linear-gradient(135deg, #00D4FF, #7C3AED);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle {
  font-size: 30px;
  color: #E2E8F0;
  font-weight: 600;
  margin-bottom: 56px;
  max-width: 800px;
  font-style: italic;
}
.footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 18px;
  letter-spacing: 2px;
  padding-top: 28px;
  border-top: 1px solid rgba(255,255,255,0.25);
}
.author {
  color: #00D4FF;
  font-weight: 700;
}
.source {
  font-style: italic;
  color: #9CA3AF;
  font-size: 14px;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div class="image">
  <div class="photo"></div>
  <div class="overlay"></div>
  <div class="dark-fade"></div>
  <div class="content">
    <div class="badge">O FUTURO DO TRABALHO</div>
    <div class="highlight-num">-43%</div>
    <h1>Profissionais que não usam IA ganham <span class="accent">43% menos</span></h1>
    <p class="subtitle">E o relógio está correndo.</p>
    <div class="footer">
      <span class="author">APOLO SANTOS</span>
      <span class="source">Fonte: Lightcast, 2026</span>
    </div>
  </div>
</div>
</body>
</html>
