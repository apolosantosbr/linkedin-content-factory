<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Thumb — Reflexão Rio Claro Pneus</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #0A0A0A; width: 1080px; height: 1350px; }
.image {
  width: 1080px;
  height: 1350px;
  position: relative;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}
.photo {
  position: absolute;
  inset: 0;
  background-image: url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?w=1080&h=1350&fit=crop');
  background-size: cover;
  background-position: center;
  filter: grayscale(100%) contrast(1.35) brightness(0.5);
}
.overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(0,212,255,0.55), rgba(124,58,237,0.70));
  mix-blend-mode: color;
}
.dark-fade {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(10,10,10,0.55) 0%, rgba(10,10,10,0.20) 40%, rgba(10,10,10,0.95) 100%);
}
.grain {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
  background-size: 3px 3px;
  opacity: 0.4;
}
.content {
  position: relative;
  z-index: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 80px;
  color: white;
}
.top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 12px 26px;
  background: rgba(255,255,255,0.10);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.35);
  border-radius: 50px;
  font-size: 16px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #00D4FF;
  box-shadow: 0 0 12px #00D4FF;
}
.date {
  font-size: 14px;
  letter-spacing: 2px;
  text-transform: uppercase;
  opacity: 0.85;
  font-weight: 700;
}
.middle {
  display: flex;
  flex-direction: column;
  gap: 18px;
  margin-top: 80px;
}
.eyebrow {
  font-size: 20px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #00D4FF;
  font-weight: 800;
  margin-bottom: 10px;
}
h1 {
  font-size: 96px;
  font-weight: 900;
  line-height: 0.98;
  letter-spacing: -3px;
  max-width: 950px;
}
h1 .caps {
  color: #F59E0B;
}
h1 .gradient {
  background: linear-gradient(135deg, #00D4FF, #7C3AED);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.quote-mark {
  position: absolute;
  top: 150px;
  left: 50px;
  font-family: 'Inter', sans-serif;
  font-size: 380px;
  line-height: 0.7;
  color: rgba(255,255,255,0.06);
  font-weight: 900;
  z-index: 0;
}
.bottom {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.separator {
  width: 100%;
  height: 1px;
  background: rgba(255,255,255,0.25);
}
.footer {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}
.author-block {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.author-name {
  font-size: 18px;
  font-weight: 900;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.author-role {
  font-size: 13px;
  letter-spacing: 2px;
  color: rgba(255,255,255,0.65);
  text-transform: uppercase;
}
.source {
  font-size: 12px;
  color: rgba(255,255,255,0.55);
  font-style: italic;
  text-align: right;
  max-width: 320px;
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="image">
  <div class="photo"></div>
  <div class="overlay"></div>
  <div class="dark-fade"></div>
  <div class="grain"></div>
  <div class="quote-mark">"</div>
  <div class="content">
    <div class="top-row">
      <div class="badge"><span class="dot"></span>REFLEXÃO</div>
      <div class="date">23 · ABR · 2026</div>
    </div>
    <div class="middle">
      <div class="eyebrow">IA aplicada no mundo real</div>
      <h1>
        IA tira o <span class="caps">CHATO</span>.<br>
        Devolve o <span class="gradient">IMPORTANTE</span>.
      </h1>
    </div>
    <div class="bottom">
      <div class="separator"></div>
      <div class="footer">
        <div class="author-block">
          <div class="author-name">APOLO SANTOS</div>
        </div>
        <div class="source">Rio Claro Pneus · abr/2026</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
