<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agro ja cortou 90% do defensivo com IA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }

.image {
  width: 1080px;
  height: 1350px;
  background: #0E2419;
  background-image:
    radial-gradient(at 20% 15%, rgba(91, 168, 74, 0.18) 0%, transparent 55%),
    radial-gradient(at 85% 90%, rgba(232, 178, 58, 0.12) 0%, transparent 55%);
  position: relative;
  overflow: hidden;
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  color: #FFFFFF;
  padding: 70px 70px;
  display: flex;
  flex-direction: column;
}

/* Linhas de plantio sutis no fundo */
.image::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 38px,
      rgba(91, 168, 74, 0.04) 38px,
      rgba(91, 168, 74, 0.04) 39px
    );
  pointer-events: none;
}

/* Numero gigante de fundo */
.bg-90 {
  position: absolute;
  right: -80px;
  top: 60px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 720px;
  font-weight: 900;
  line-height: 0.85;
  color: rgba(232, 178, 58, 0.06);
  letter-spacing: -10px;
  pointer-events: none;
  z-index: 1;
}

.top {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 40px;
}

.kicker {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 10px 20px;
  background: rgba(232, 178, 58, 0.1);
  border: 1px solid rgba(232, 178, 58, 0.4);
  border-radius: 999px;
  font-size: 13px;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 800;
  color: #E8B23A;
}

.kicker .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #5BA84A;
  box-shadow: 0 0 12px #5BA84A;
}

.tag-right {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.4);
  font-weight: 700;
  text-align: right;
  line-height: 1.5;
}

.center {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 3;
}

.l1 {
  font-family: 'Anton', 'Bebas Neue', sans-serif;
  font-weight: 900;
  font-size: 76px;
  line-height: 0.96;
  letter-spacing: 0.5px;
  color: rgba(255, 255, 255, 0.7);
  margin-bottom: 4px;
}

.l2 {
  font-family: 'Anton', 'Bebas Neue', sans-serif;
  font-weight: 900;
  font-size: 76px;
  line-height: 0.96;
  letter-spacing: 0.5px;
  color: rgba(255, 255, 255, 0.7);
  margin-bottom: 24px;
}

.l3 {
  font-family: 'Anton', 'Bebas Neue', sans-serif;
  font-weight: 900;
  font-size: 110px;
  line-height: 0.92;
  letter-spacing: -1px;
  color: #FFFFFF;
}

.l3 .agro {
  color: #E8B23A;
  position: relative;
  display: inline-block;
}

.l4 {
  font-family: 'Anton', 'Bebas Neue', sans-serif;
  font-weight: 900;
  font-size: 110px;
  line-height: 0.92;
  letter-spacing: -1px;
  color: #FFFFFF;
}

.l4 .nine {
  color: #E8B23A;
  position: relative;
  display: inline-block;
}

.l4 .nine::after {
  content: '';
  position: absolute;
  left: -4px;
  right: -4px;
  bottom: -10px;
  height: 8px;
  background: #5BA84A;
}

.l5 {
  font-family: 'Anton', 'Bebas Neue', sans-serif;
  font-weight: 900;
  font-size: 110px;
  line-height: 0.92;
  letter-spacing: -1px;
  color: #FFFFFF;
}

.bottom {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  padding-top: 30px;
  border-top: 1px solid rgba(232, 178, 58, 0.25);
}

.author {
  font-size: 14px;
  letter-spacing: 5px;
  font-weight: 800;
  color: #E8B23A;
}

.source {
  font-size: 12px;
  font-style: italic;
  color: rgba(255, 255, 255, 0.55);
  letter-spacing: 0.5px;
  text-align: right;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="image">

  <div class="bg-90">90</div>

  <div class="top">
    <div class="kicker"><span class="dot"></span>BRASIL PROFUNDO · IA</div>
    <div class="tag-right">MAIO 2026<br>POST LINKEDIN</div>
  </div>

  <div class="center">
    <div class="l1">ENQUANTO O TECH</div>
    <div class="l2">URBANO DISCUTE PROMPT,</div>
    <div class="l3">O <span class="agro">AGRO</span> JÁ CORTOU</div>
    <div class="l4"><span class="nine">90%</span> DO DEFENSIVO</div>
    <div class="l5">COM IA.</div>
  </div>

  <div class="bottom">
    <div class="author">APOLO SANTOS</div>
    <div class="source">fontes: ConectaAgro 2026<br>+ CNA Brasil 2026</div>
  </div>

</div>
</body>
</html>
