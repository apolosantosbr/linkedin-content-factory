<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Horizons 1M usuarios</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }

.image {
  width: 1200px;
  height: 630px;
  background: #0A0420;
  background-image:
    radial-gradient(at 85% 20%, rgba(124, 58, 237, 0.55) 0%, transparent 55%),
    radial-gradient(at 15% 90%, rgba(103, 61, 230, 0.45) 0%, transparent 55%),
    radial-gradient(at 60% 60%, rgba(163, 102, 255, 0.25) 0%, transparent 60%);
  position: relative;
  overflow: hidden;
  font-family: 'Inter', -apple-system, system-ui, sans-serif;
  color: #FFFFFF;
  padding: 56px 64px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.image::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  pointer-events: none;
  mask-image: radial-gradient(ellipse at center, rgba(0,0,0,1) 20%, rgba(0,0,0,0) 80%);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  position: relative;
  z-index: 2;
}

.author {
  font-size: 13px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #C4B5FD;
  font-weight: 700;
}

.badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 22px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(196, 181, 253, 0.35);
  backdrop-filter: blur(12px);
  border-radius: 999px;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: #E9D5FF;
}

.badge .dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #22D3EE;
  box-shadow: 0 0 12px #22D3EE;
}

.center {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  margin-top: -10px;
}

.eyebrow {
  font-size: 20px;
  font-weight: 700;
  color: #C4B5FD;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.hero {
  font-size: 180px;
  font-weight: 900;
  line-height: 0.95;
  letter-spacing: -6px;
  background: linear-gradient(135deg, #FFFFFF 0%, #C4B5FD 45%, #7C3AED 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  text-shadow: 0 0 80px rgba(124, 58, 237, 0.4);
}

.subtitle {
  font-size: 30px;
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.15;
  margin-top: 14px;
  max-width: 780px;
}

.subtitle .mute {
  color: #A78BFA;
  font-weight: 600;
}

.bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  position: relative;
  z-index: 2;
}

.source {
  font-size: 13px;
  color: #A78BFA;
  font-style: italic;
  letter-spacing: 0.5px;
}

.logo-wrap {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}

.logo-wrap .partner {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: #C4B5FD;
}

.logo-wrap img {
  height: 36px;
  width: auto;
  filter: drop-shadow(0 0 20px rgba(124, 58, 237, 0.4));
}
</style>
</head>
<body>
<div class="image">

  <div class="top">
    <div class="author">APOLO SANTOS</div>
    <div class="badge">
      <span class="dot"></span>
      Brasil no TOP 3 global
    </div>
  </div>

  <div class="center">
    <div class="eyebrow">Horizons cruzou a marca</div>
    <div class="hero">1.000.000</div>
    <div class="subtitle">de usuários construíram algo em <span class="mute">12 meses</span></div>
  </div>

  <div class="bottom">
    <div class="source">Fonte: Hostinger Blog, mar/2026</div>
    <div class="logo-wrap">
      <div class="partner">Parceiro Oficial</div>
      <img src="logos/Hostinger_Horizontal_White.png" alt="Hostinger">
    </div>
  </div>

</div>
</body>
</html>
