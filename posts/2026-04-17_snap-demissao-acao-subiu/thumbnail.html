<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Snap +11% — Split Tensao</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #111; display: flex; justify-content: center; padding: 40px; }
.image {
  width: 1080px;
  height: 1350px;
  display: grid;
  grid-template-rows: 1fr 1fr;
  font-family: 'Inter', -apple-system, sans-serif;
  position: relative;
  overflow: hidden;
}

/* TOPO — VERMELHO (demissao) */
.top {
  background: #0A0A0A;
  position: relative;
  padding: 80px 80px 60px 80px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}
.top::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 85% 20%, rgba(239, 68, 68, 0.22) 0%, transparent 55%),
    radial-gradient(circle at 15% 85%, rgba(239, 68, 68, 0.12) 0%, transparent 50%);
}
.top::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(239,68,68,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(239,68,68,0.06) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: linear-gradient(180deg, rgba(0,0,0,1), rgba(0,0,0,0.3));
}
.top-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 2;
}
.ticker {
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: #EF4444;
  letter-spacing: 2px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.ticker .dot {
  width: 10px;
  height: 10px;
  background: #EF4444;
  border-radius: 50%;
  box-shadow: 0 0 12px rgba(239,68,68,0.8);
}
.tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  letter-spacing: 3px;
  color: #A0AEC0;
  text-transform: uppercase;
}

.top-body {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex: 1;
  padding: 20px 0;
}
.top-label {
  font-size: 22px;
  color: #A0AEC0;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 16px;
}
.top-number {
  font-size: 260px;
  font-weight: 900;
  line-height: 0.88;
  letter-spacing: -10px;
  color: #EF4444;
  text-shadow: 0 0 60px rgba(239,68,68,0.35);
  font-variant-numeric: tabular-nums;
}
.top-desc {
  font-size: 26px;
  font-weight: 700;
  color: #E2E8F0;
  margin-top: 12px;
  line-height: 1.2;
}
.top-desc .mute { color: #6B7280; font-weight: 500; }

/* DIVISOR */
.divider {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  transform: translateY(-50%);
  z-index: 5;
  display: flex;
  justify-content: center;
  align-items: center;
  pointer-events: none;
}
.divider-bar {
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2) 20%, rgba(255,255,255,0.2) 80%, transparent);
}
.divider-chip {
  position: absolute;
  background: #0A0A0A;
  border: 2px solid rgba(255,255,255,0.25);
  padding: 14px 28px;
  border-radius: 50px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 16px;
  font-weight: 700;
  color: #FFFFFF;
  letter-spacing: 3px;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 0 30px rgba(0,0,0,0.8);
}
.divider-chip .arrow {
  color: #10B981;
  font-size: 20px;
}

/* EMBAIXO — VERDE (acao subiu) */
.bottom {
  background: #0A0A0A;
  position: relative;
  padding: 60px 80px 80px 80px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}
.bottom::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 15% 25%, rgba(16, 185, 129, 0.28) 0%, transparent 55%),
    radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.14) 0%, transparent 55%);
}
.bottom::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(16,185,129,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(16,185,129,0.06) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: linear-gradient(0deg, rgba(0,0,0,1), rgba(0,0,0,0.3));
}
.bottom-body {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  flex: 1;
}
.bottom-label {
  font-size: 22px;
  color: #A0AEC0;
  letter-spacing: 3px;
  text-transform: uppercase;
  font-weight: 700;
  margin-bottom: 16px;
}
.bottom-number {
  font-size: 260px;
  font-weight: 900;
  line-height: 0.88;
  letter-spacing: -10px;
  color: #10B981;
  text-shadow: 0 0 60px rgba(16,185,129,0.4);
  font-variant-numeric: tabular-nums;
  display: flex;
  align-items: flex-start;
  gap: 8px;
}
.bottom-number .sign {
  font-size: 180px;
  line-height: 1;
  margin-top: 18px;
}
.bottom-desc {
  font-size: 26px;
  font-weight: 700;
  color: #E2E8F0;
  margin-top: 12px;
  line-height: 1.2;
}
.bottom-desc .mute { color: #6B7280; font-weight: 500; }

.footer {
  position: relative;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 24px;
  border-top: 1px solid rgba(255,255,255,0.12);
  font-size: 13px;
  letter-spacing: 2px;
  text-transform: uppercase;
  font-weight: 700;
}
.author { color: #FFFFFF; }
.source {
  color: #6B7280;
  font-style: italic;
  text-transform: none;
  letter-spacing: 0.5px;
  font-weight: 500;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
}
</style>
</head>
<body>
<div class="image">

  <!-- TOPO — DEMISSAO -->
  <div class="top">
    <div class="top-header">
      <div class="ticker"><span class="dot"></span>SNAP · NYSE</div>
      <div class="tag">15 / ABR / 2026</div>
    </div>
    <div class="top-body">
      <div class="top-label">Demissões em 1 dia</div>
      <div class="top-number">−1.000</div>
      <div class="top-desc">16% do time cortado <span class="mute">— justificativa: "AI efficiency"</span></div>
    </div>
  </div>

  <!-- DIVISOR -->
  <div class="divider">
    <div class="divider-bar"></div>
    <div class="divider-chip">E O QUE ACONTECEU <span class="arrow">→</span></div>
  </div>

  <!-- EMBAIXO — ACAO -->
  <div class="bottom">
    <div class="bottom-body">
      <div class="bottom-label">Reação do mercado</div>
      <div class="bottom-number"><span class="sign">+</span>11<span style="font-size:180px;line-height:1;margin-top:18px;">%</span></div>
      <div class="bottom-desc">A ação <span style="color:#10B981;font-weight:900;">subiu</span> <span class="mute">— layoff por IA virou tese de valor</span></div>
    </div>
    <div class="footer">
      <span class="author">APOLO SANTOS</span>
      <span class="source">Fonte: SEC filing + Tom's Hardware, 2026</span>
    </div>
  </div>

</div>
</body>
</html>
