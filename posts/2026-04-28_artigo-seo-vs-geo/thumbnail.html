<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Artigo SEO vs GEO — Capa</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap');
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
@page { size: 1200px 627px; margin: 0; }
html, body { margin: 0; padding: 0; background: #0A0A1F; width: 1200px; height: 627px; }
.image {
  width: 1200px;
  height: 627px;
  position: relative;
  overflow: hidden;
  font-family: 'Inter', -apple-system, sans-serif;
  background:
    radial-gradient(ellipse at 15% 50%, rgba(124, 58, 237, 0.35) 0%, transparent 60%),
    radial-gradient(ellipse at 85% 50%, rgba(0, 212, 255, 0.28) 0%, transparent 60%),
    linear-gradient(135deg, #0A0A1F 0%, #16102E 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 80px 60px;
}
.hero {
  display: flex;
  align-items: center;
  gap: 40px;
  line-height: 0.9;
}
.seo {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 220px;
  font-weight: 900;
  color: rgba(255, 255, 255, 0.3);
  letter-spacing: -8px;
  text-decoration: line-through;
  text-decoration-color: #FF4785;
  text-decoration-thickness: 10px;
}
.arrow {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 120px;
  font-weight: 900;
  color: #F4D35E;
  filter: drop-shadow(0 0 24px rgba(244, 211, 94, 0.5));
  line-height: 0.7;
}
.geo {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 220px;
  font-weight: 900;
  color: #FFFFFF;
  letter-spacing: -8px;
  filter: drop-shadow(0 0 36px rgba(0, 212, 255, 0.6));
}
.subtitle {
  margin-top: 40px;
  font-size: 30px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.85);
  letter-spacing: 0.5px;
  text-align: center;
}
.author {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 18px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.6);
  letter-spacing: 4px;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div class="image">
  <div class="hero">
    <div class="seo">SEO</div>
    <div class="arrow">→</div>
    <div class="geo">GEO</div>
  </div>
  <div class="subtitle">O novo jogo da busca em 2026.</div>
  <div class="author">Apolo Santos</div>
</div>
</body>
</html>
