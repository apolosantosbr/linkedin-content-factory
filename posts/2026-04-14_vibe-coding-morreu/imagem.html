<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  .image {
    width: 1080px;
    height: 1350px;
    background: #0A0A0A;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px;
    position: relative;
    overflow: hidden;
  }
  .bg-circle {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,212,255,0.08) 0%, transparent 70%);
    top: -100px;
    right: -100px;
  }
  .bg-circle-2 {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(124,58,237,0.08) 0%, transparent 70%);
    bottom: -50px;
    left: -50px;
  }
  .badge {
    display: inline-block;
    padding: 10px 24px;
    background: rgba(0, 212, 255, 0.1);
    border: 1px solid rgba(0, 212, 255, 0.3);
    border-radius: 50px;
    font-size: 18px;
    color: #00D4FF;
    text-transform: uppercase;
    letter-spacing: 2px;
    font-family: 'Inter', sans-serif;
    margin-bottom: 40px;
    z-index: 1;
  }
  h1 {
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 96px;
    font-weight: 900;
    color: #FFFFFF;
    text-align: center;
    line-height: 1.05;
    z-index: 1;
    margin-bottom: 24px;
  }
  h1 .gradient {
    background: linear-gradient(135deg, #00D4FF, #7C3AED);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .divider {
    width: 120px;
    height: 3px;
    background: linear-gradient(90deg, #00D4FF, #7C3AED);
    margin: 32px 0;
    border-radius: 2px;
    z-index: 1;
  }
  .subtitle {
    font-family: 'Inter', sans-serif;
    font-size: 32px;
    color: #A0AEC0;
    text-align: center;
    line-height: 1.4;
    z-index: 1;
    max-width: 800px;
  }
  .author {
    position: absolute;
    bottom: 60px;
    font-family: 'Inter', sans-serif;
    font-size: 20px;
    color: #00D4FF;
    letter-spacing: 2px;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="image">
  <div class="bg-circle"></div>
  <div class="bg-circle-2"></div>
  <div class="badge">IA & VIBE CODING</div>
  <h1>Vibe Coding<br><span class="gradient">Morreu?</span></h1>
  <div class="divider"></div>
  <p class="subtitle">Karpathy diz que sim. 92% dos devs discordam.</p>
  <p class="author">APOLO SANTOS</p>
</div>
</body>
</html>
